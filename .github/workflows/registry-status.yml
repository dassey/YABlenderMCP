name: Registry status

# Run by hand (Actions > Registry status > Run workflow) to change listings in the MCP Registry:
# deleted hides a listing, active brings it back, deprecated marks it as replaced.
# Signs in with GitHub OIDC like publish.yml: no stored tokens.
on:
  workflow_dispatch:
    inputs:
      listing:
        description: "Listing"
        type: choice
        options: [both, io.github.dassey/yablendermcp, io.github.dassey/yab-mcp]
        default: both
      status:
        description: "New status"
        type: choice
        options: [deleted, active, deprecated]
        default: deleted
      version:
        description: "Version, or all"
        default: "all"
      message:
        description: "Message shown with the status (optional)"
        default: ""

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MCP Registry login
    steps:
      - name: Change the status
        env:
          LISTING: ${{ inputs.listing }}
          VERSION: ${{ inputs.version }}
          STATUS: ${{ inputs.status }}
          MESSAGE: ${{ inputs.message }}
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          names="$LISTING"
          [ "$LISTING" = both ] && names="io.github.dassey/yablendermcp io.github.dassey/yab-mcp"
          failed=0
          for name in $names; do
            if [ "$VERSION" = all ]; then
              out=$(./mcp-publisher status --status "$STATUS" --message "$MESSAGE" --all-versions --yes "$name" 2>&1) || rc=$?
            else
              out=$(./mcp-publisher status --status "$STATUS" --message "$MESSAGE" "$name" "$VERSION" 2>&1) || rc=$?
            fi
            echo "$out"
            # Running it twice is fine: the registry answers "No changes to apply"
            if [ "${rc:-0}" != 0 ] && ! grep -q "No changes to apply" <<<"$out"; then failed=1; fi
            rc=0
          done
          exit $failed
